spring.application.name=gateway
server.address=0.0.0.0
server.port=${PORT:8080}

# Rutas: /api/auth y /api/usuarios -> ms-usuarios, /api/productos -> ms-productos, /api/pedidos -> ms-pedidos.
# Las rutas /internal/** NO se publican.
spring.cloud.gateway.server.webmvc.routes[0].id=ms-usuarios
spring.cloud.gateway.server.webmvc.routes[0].uri=${MS_USUARIOS_URL:http://localhost:8081}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**,/api/usuarios/**

spring.cloud.gateway.server.webmvc.routes[1].id=ms-productos
spring.cloud.gateway.server.webmvc.routes[1].uri=${MS_PRODUCTOS_URL:http://localhost:8082}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/productos/**

spring.cloud.gateway.server.webmvc.routes[2].id=ms-pedidos
spring.cloud.gateway.server.webmvc.routes[2].uri=${MS_PEDIDOS_URL:http://localhost:8083}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/pedidos/**
app.cors.allowed-origins=*
