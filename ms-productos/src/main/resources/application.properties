spring.application.name=ms-productos
server.address=0.0.0.0
server.port=${PORT:8082}

# --- Base de datos propia del microservicio: H2 en archivo (./data/productos) ---
spring.datasource.url=jdbc:h2:file:./data/productos;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.error.include-stacktrace=never

# --- Seguridad compartida por todos los microservicios (cámbialas con variables de entorno) ---
app.jwt.secret=${JWT_SECRET:casajojo-clave-de-desarrollo-cambiar-en-produccion-2026}
app.jwt.duracion-horas=8
app.interno.clave=${INTERNAL_KEY:casajojo-interno-dev}
app.cors.enabled=false
app.cors.allowed-origins=*

app.seed.enabled=true
