# Perfil opcional MySQL:  ./mvnw -pl ms-usuarios spring-boot:run -Dspring-boot.run.profiles=mysql
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/usuarios?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.h2.console.enabled=false
