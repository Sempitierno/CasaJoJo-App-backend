spring.application.name=ms-usuarios
server.address=0.0.0.0
server.port=${PORT:8081}

# --- Base de datos propia del microservicio: H2 en archivo (./data/usuarios) ---
spring.datasource.url=jdbc:h2:file:./data/usuarios;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.error.include-stacktrace=never

# --- Seguridad compartida por todos los microservicios (cámbialas con variables de entorno) ---
app.jwt.secret=${JWT_SECRET:casajojo-clave-de-desarrollo-cambiar-en-produccion-2026}
app.jwt.duracion-horas=8
app.interno.clave=${INTERNAL_KEY:casajojo-interno-dev}
app.cors.enabled=false
app.cors.allowed-origins=*

app.servicios.pedidos=${MS_PEDIDOS_URL:http://localhost:8083}
app.recuperacion.mostrar-codigo=true
app.seed.enabled=true
app.seed.password=${SEED_PASSWORD:casajojo123}
app.seguridad.rutas-protegidas=/api/usuarios/**,/api/auth/yo
