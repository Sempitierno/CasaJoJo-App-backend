spring.application.name=ms-pedidos
server.address=0.0.0.0
server.port=${PORT:8083}

# --- Base de datos propia del microservicio: H2 en archivo (./data/pedidos) ---
spring.datasource.url=jdbc:h2:file:./data/pedidos;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.error.include-stacktrace=never

# --- Seguridad compartida por todos los microservicios (cámbialas con variables de entorno) ---
app.jwt.secret=${JWT_SECRET:casajojo-clave-de-desarrollo-cambiar-en-produccion-2026}
app.jwt.duracion-horas=8
app.interno.clave=${INTERNAL_KEY:casajojo-interno-dev}
app.cors.enabled=false
app.cors.allowed-origins=*

app.servicios.usuarios=${MS_USUARIOS_URL:http://localhost:8081}
app.servicios.productos=${MS_PRODUCTOS_URL:http://localhost:8082}
app.seguridad.rutas-protegidas=/api/pedidos/**
